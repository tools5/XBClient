name: iOS Build

run-name: iOS Build · ${{ github.head_ref || github.ref_name }} · @${{ github.actor }} · #${{ github.run_number }}

# 打包本切片：Rust 内核交叉编译 → XcodeGen 生成工程 → xcodebuild 关签名归档 →
# ldid 伪签名（注入 entitlements）→ 打成 IPA。
# 产出两个 IPA：BBcloud.ipa（ldid 伪签名，供巨魔R/TrollStore 安装）
#              BBcloud-unsigned.ipa（未签名，供 ReSign 证书重签）。
# 本地无法构建 iOS（Windows 无 Xcode），此工作流是唯一验证门禁。

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/ios/**'
      - 'rust/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: BBcloud IPA (aarch64-apple-ios)
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # 0) 选用镜像上最新的 Xcode：macos-14 默认 xcode-select 指向 15.4，
      #    而 XcodeGen 2.45 生成的工程格式（objectVersion）15.4 读不了（Unable to read project）。
      - name: Select latest Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          xcodebuild -version

      # 1) Rust 静态库（真机 aarch64-apple-ios，绝不用 -sim）
      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Build aerion-core staticlib
        run: cargo build --release --target aarch64-apple-ios --manifest-path rust/aerion-core/Cargo.toml

      # 2) 把静态库与 C 头放到 project.yml 引用的确切路径
      - name: Stage Rust artifacts for Xcode
        run: |
          set -euo pipefail
          LIB=$(find . -path '*aarch64-apple-ios/release/libaerion_core.a' | head -1)
          test -n "$LIB"
          mkdir -p apps/ios/Vendor apps/ios/AerionCore
          cp "$LIB" apps/ios/Vendor/libaerion_core.a
          cp rust/aerion-core/include/aerion_core.h apps/ios/AerionCore/aerion_core.h
          ls -lh apps/ios/Vendor/libaerion_core.a
          lipo -info apps/ios/Vendor/libaerion_core.a || true

      # 3) 生成 Xcode 工程
      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd apps/ios && xcodegen generate

      # 4) 关签名归档（app 内已内嵌 PlugIns/PacketTunnel.appex）
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/BBcloud.xcodeproj \
            -scheme BBcloud \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/BBcloud.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            clean archive

      # 5) 组装 Payload/ 并产出两个 IPA
      - name: Assemble Payload
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/BBcloud.xcarchive/Products/Applications/BBcloud.app build/Payload/

      # 5a) 未签名 IPA（供 ReSign 证书重签）
      - name: Zip unsigned IPA
        run: cd build && zip -qr BBcloud-unsigned.ipa Payload && ls -la BBcloud-unsigned.ipa

      # 5b) ldid 伪签名（注入 entitlements，供巨魔R/TrollStore）
      - name: ldid pseudo-sign
        run: |
          set -euo pipefail
          APP="build/Payload/BBcloud.app"

          # 内嵌 dylib/framework（若有）
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' f; do
              ldid -S "$f"
            done
            find "$APP/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' fw; do
              bin="$fw/$(basename "$fw" .framework)"
              [ -f "$bin" ] && ldid -S "$bin"
            done
          fi

          # 扩展（带扩展权限）
          ldid -Sapps/ios/entitlements/appex.entitlements "$APP/PlugIns/PacketTunnel.appex/PacketTunnel"

          # 主 App（带主 App 权限）
          ldid -Sapps/ios/entitlements/app.entitlements "$APP/BBcloud"

      # 6) ldid 签名后的 IPA
      - name: Zip signed IPA
        run: cd build && zip -qr BBcloud.ipa Payload && ls -la BBcloud.ipa BBcloud-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BBcloud-ipa
          path: |
            build/BBcloud.ipa
            build/BBcloud-unsigned.ipa
            apps/ios/entitlements/

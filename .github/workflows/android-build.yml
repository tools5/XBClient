name: Android Build (BBcloud)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    paths: [ "apps/android/**", "build.gradle.kts", "gradle.properties", "apps/android/src/main/res/values/strings.xml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName=1.0.0 \
            -PversionCode=1 \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBcloud-Release-APK
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: apps/android/app/build/outputs/apk/release/app-release.apk.log
